name: Intel Mac Desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop-intel.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-intel.yml']
permissions:
  contents: read
jobs:
  desktop-intel:
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm desktop shell is present
        working-directory: .
        run: |
          test -f desktop/package.json
          test -f desktop/main.cjs
          test -f desktop/preload.cjs
      - name: Install dependencies
        run: npm install
      - name: JavaScript syntax and tests
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check renderer.js
          npm test
      - name: Package Intel Mac application
        shell: bash
        run: |
          # DMG creation can intermittently fail when macOS reports a mounted image as busy.
          for attempt in 1 2 3; do
            if npm run build:mac; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Packaging attempt $attempt failed; cleaning stale disk images before retry."
            hdiutil info || true
            sleep 12
            rm -rf dist
          done
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged module manifest
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');for(const f of ['meshtastic-codec.cjs','packet-monitor.cjs','connection-diagnostics.cjs','ble-transport.cjs']){if(!p.build.files.includes(f)||!fs.existsSync(f))throw Error('Missing packaged module '+f)}"
      - name: Verify x86_64 binary and download files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          files=list(Path('dist').glob('mac*/Mesh Marauder.app/Contents/MacOS/Mesh Marauder'))
          assert len(files)==1, f'Expected one app binary; got {files}'
          arch=subprocess.check_output(['lipo','-archs',str(files[0])],text=True).split()
          assert 'x86_64' in arch, f'Expected Intel x86_64: {arch}'
          assert list(Path('dist').glob('*.dmg'))
          assert list(Path('dist').glob('*.zip'))
          PY
      - name: Smoke test assistant link (MCP stdio) in the packaged app
        shell: bash
        run: |
          APP=$(ls -d dist/mac*/"Mesh Marauder.app" | head -1)
          export MESH_MARAUDER_INTEGRATIONS_DIR="$RUNNER_TEMP/mm-integrations"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_nodes","arguments":{}}}' \
            | ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/Mesh Marauder" "$APP/Contents/Resources/app.asar/assistant-mcp.cjs" | tee mcp.log
          grep -q '"serverInfo"' mcp.log
          grep -q '"node_telemetry"' mcp.log
          ! grep -q '"send_message"' mcp.log
          grep -q 'assistant link is off' mcp.log
      - name: Capture desktop screenshot (best effort)
        continue-on-error: true
        run: npx electron capture-screenshot.cjs
        env:
          ELECTRON_ENABLE_LOGGING: '1'
      - name: Validate captured screenshot (if present)
        shell: bash
        run: |
          if test -f dist/screenshots/operations-overview.png; then
            node validate-screenshot.cjs dist/screenshots/operations-overview.png
          else
            echo 'Screenshot not captured on this runner; no screenshot artifact will be uploaded.'
          fi
      - name: Upload desktop screenshot if captured
        uses: actions/upload-artifact@v4
        with:
          name: mesh-marauder-ui-screenshot
          path: desktop/dist/screenshots/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: mesh-marauder-macos-intel
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error
